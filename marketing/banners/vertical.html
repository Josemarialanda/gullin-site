<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gullin banner, vertical 1080×1920</title>
<link rel="stylesheet" href="banner.css">
<style>
.banner{width:1080px;height:1920px;padding:110px 96px 104px;display:flex;flex-direction:column;justify-content:space-between}
.wordmark{font-size:60px}
.headline{margin-top:72px;font-size:112px}
.sub{margin-top:36px;font-size:40px;max-width:820px}

.flow{display:flex;flex-direction:column}
.card{width:600px;padding:34px 38px;gap:22px}
.card.left{align-self:flex-start;transform:rotate(-2.5deg)}
.card.right{align-self:flex-end;transform:rotate(2.5deg)}
.tag{font-size:19px}
.row{display:flex;align-items:center;gap:20px}
.avatar{width:62px;height:62px;font-size:26px}
.subject{font-size:30px;font-weight:600}
.lines{display:flex;flex-direction:column;gap:14px}
.line{height:14px}
.turn{padding:8px 18px;font-size:20px}
.approve-q{font-size:32px;font-weight:600}
.chip{height:62px;padding:0 30px;font-size:24px}
.tick{width:68px;height:68px}
.amount{font-family:var(--font-display);font-size:64px;font-weight:500;letter-spacing:-0.03em;line-height:1}
.arrow{width:110px;height:64px;margin:6px 0}
.arrow.to-right{align-self:center;transform:translateX(40px)}
.arrow.to-left{align-self:center;transform:translateX(-40px) scaleX(-1)}

.foot{display:flex;align-items:center;justify-content:space-between}
.join{display:inline-flex;align-items:center;height:84px;padding:0 40px;border-radius:20px;background:var(--clay-ink);color:#fff;font-size:30px;font-weight:600}
.url{font-size:34px}
</style>
</head>
<body>
<div class="banner">
  <div>
    <span class="wordmark">Gullin</span>
    <h1 class="headline">From first enquiry to final payment.</h1>
    <p class="sub">AI that handles your client emails. You approve every message.</p>
  </div>

  <div class="flow">
    <div class="card c-email left">
      <span class="tag">New email</span>
      <span class="row"><span class="avatar">S</span><span class="subject">Blog post for March?</span></span>
    </div>
    <svg class="arrow to-right" viewBox="0 0 110 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4c0 34 40 48 82 52M84 46l12 10-14 6"/></svg>
    <div class="card c-draft right">
      <span class="tag row" style="gap:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Gullin writes</span>
      <span class="lines"><span class="line" style="width:100%"></span><span class="line" style="width:84%"></span><span class="line" style="width:62%"></span></span>
    </div>
    <svg class="arrow to-left" viewBox="0 0 110 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4c0 34 40 48 82 52M84 46l12 10-14 6"/></svg>
    <div class="card c-approve left">
      <span class="row" style="justify-content:space-between"><span class="approve-q">Send the reply?</span><span class="turn">Your turn</span></span>
      <span class="chip chip-dark" style="align-self:flex-start">Approve</span>
    </div>
    <svg class="arrow to-right" viewBox="0 0 110 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4c0 34 40 48 82 52M84 46l12 10-14 6"/></svg>
    <div class="card c-paid right">
      <span class="row"><span class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span style="display:flex;flex-direction:column;gap:8px"><span class="tag">Invoice paid</span><span class="amount">$1,040</span></span></span>
    </div>
  </div>

  <div class="foot">
    <span class="join">Join the waiting list</span>
    <span class="url">gullin.work</span>
  </div>
</div>
</body>
</html>
