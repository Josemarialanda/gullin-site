<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gullin banner, horizontal 1500×500</title>
<link rel="stylesheet" href="banner.css">
<style>
.banner{width:1500px;height:500px;padding:56px 64px;display:flex;align-items:center;gap:56px}
.copy{width:600px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.wordmark{font-size:34px}
.headline{font-size:56px}
.sub{margin-top:18px;font-size:21px;max-width:560px}
.url{font-size:20px}

.flow{flex:1;display:flex;align-items:center;justify-content:space-between}
.card{width:158px;min-height:176px;padding:20px;gap:14px}
.card.up{transform:translateY(-34px) rotate(-3deg)}
.card.down{transform:translateY(34px) rotate(3deg)}
.tag{font-size:11px;letter-spacing:.08em}
.avatar{width:36px;height:36px;font-size:16px}
.subject{font-size:15px;font-weight:600;line-height:1.3}
.lines{display:flex;flex-direction:column;gap:9px}
.line{height:9px}
.turn{align-self:flex-start;padding:5px 11px;font-size:12px}
.approve-q{font-size:15px;font-weight:600;line-height:1.3}
.chip{height:38px;padding:0 16px;font-size:14px;align-self:flex-start}
.tick{width:40px;height:40px}
.amount{font-family:var(--font-display);font-size:34px;font-weight:500;letter-spacing:-0.03em;line-height:1}
.arrow{width:34px;height:20px}
</style>
</head>
<body>
<div class="banner">
  <div class="copy">
    <span class="wordmark">Gullin</span>
    <div>
      <h1 class="headline">Automate the boring<br>parts of your work.</h1>
      <p class="sub">Gullin pairs AI with a specialized automation harness to handle the routine work, so you can focus on what matters.</p>
    </div>
    <span class="url">gullin.work</span>
  </div>

  <div class="flow">
    <div class="card c-email up">
      <span class="tag">New email</span>
      <span class="avatar">M</span>
      <span class="subject">Container arriving Thursday</span>
    </div>
    <svg class="arrow" viewBox="0 0 34 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10h28M23 3l7 7-7 7"/></svg>
    <div class="card c-draft down">
      <span class="tag" style="display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Gullin writes</span>
      <span class="lines"><span class="line" style="width:100%"></span><span class="line" style="width:82%"></span><span class="line" style="width:92%"></span><span class="line" style="width:58%"></span></span>
    </div>
    <svg class="arrow" viewBox="0 0 34 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10h28M23 3l7 7-7 7"/></svg>
    <div class="card c-approve up">
      <span class="turn">Your turn</span>
      <span class="approve-q">Send the request?</span>
      <span class="chip chip-dark">Approve</span>
    </div>
    <svg class="arrow" viewBox="0 0 34 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10h28M23 3l7 7-7 7"/></svg>
    <div class="card c-paid down">
      <span class="tick"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="tag">Paid</span>
      <span class="amount">$620</span>
    </div>
  </div>
</div>
</body>
</html>
